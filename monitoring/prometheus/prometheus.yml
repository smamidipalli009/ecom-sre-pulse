global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "payment-service"
    static_configs:
      - targets: ["payment:8001"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: payment

  - job_name: "product-catalog"
    static_configs:
      - targets: ["product-catalog:8002"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: product-catalog

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8003"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: order-service

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
