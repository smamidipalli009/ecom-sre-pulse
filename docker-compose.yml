networks:
  ecom-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ── Microservices ──────────────────────────
  payment:
    build: ./services/payment
    ports: ["8001:8001"]
    networks: [ecom-net]
    restart: unless-stopped
    labels:
      com.docker.compose.service: payment

  product-catalog:
    build: ./services/product-catalog
    ports: ["8002:8002"]
    networks: [ecom-net]
    restart: unless-stopped
    labels:
      com.docker.compose.service: product-catalog

  order-service:
    build: ./services/order-service
    ports: ["8003:8003"]
    networks: [ecom-net]
    environment:
      PAYMENT_URL: http://payment:8001
      CATALOG_URL: http://product-catalog:8002
    depends_on: [payment, product-catalog]
    restart: unless-stopped
    labels:
      com.docker.compose.service: order-service

  # ── Observability Stack ────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks: [ecom-net]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--cluster.listen-address="
    networks: [ecom-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports: ["4000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "tempoSearch tempoBackendSearch"
    networks: [ecom-net]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    user: "0"
    ports: ["3100:3100"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [ecom-net]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks: [ecom-net]
    depends_on: [loki]
    restart: unless-stopped

  # ── Load Generator ─────────────────────────
  load-generator:
    build: ./load-generator
    ports: ["8089:8089"]
    networks: [ecom-net]
    depends_on: [payment, product-catalog, order-service]
    profiles: ["load"]
    restart: unless-stopped
